
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | FYP Management System</title>

    <link rel="stylesheet"
          href="{% static 'students/css/student-dashboard.css' %}">

    <style>
        body {
            background: #f5f7fa;
            margin: 0;
        }

        .profile-topbar {
            background: #10294b;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .profile-topbar h2 {
            margin-bottom: 5px;
        }

        .profile-topbar p {
            color: #d5dce6;
            font-size: 13px;
        }

        .back-button {
            background: #d5ad54;
            color: #10294b;
            padding: 11px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .page-container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 25px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            color: #10294b;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #777;
            font-size: 14px;
        }

        .edit-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #edf0f4;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 25px;
            border-bottom: 1px solid #edf0f4;
            margin-bottom: 25px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #10294b;
            color: #d5ad54;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .profile-header h2 {
            color: #10294b;
            font-size: 20px;
            margin-bottom: 6px;
        }

        .profile-header p {
            color: #777;
            font-size: 13px;
        }

        .section-title {
            color: #10294b;
            font-size: 17px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group label {
            display: block;
            color: #444;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe4eb;
            border-radius: 7px;
            background: #f8fafc;
            color: #10294b;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #d5ad54;
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .profile-actions {
            display: flex;
            justify-content: flex-end;
            gap: 13px;
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid #edf0f4;
        }

        .action-button {
            padding: 12px 23px;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .cancel-button {
            background: #edf0f4;
            color: #10294b;
        }

        .save-button {
            background: #10294b;
            color: white;
        }

        .save-button:hover {
            background: #1b3c65;
        }

        @media(max-width: 650px) {
            .profile-topbar {
                padding: 18px;
                gap: 15px;
                flex-wrap: wrap;
            }

            .page-container {
                padding: 0 15px;
            }

            .edit-card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .profile-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="profile-topbar">
    <div>
        <h2>RIPHAH</h2>
        <p>FYP MANAGEMENT SYSTEM</p>
    </div>

    <a href="{% url 'student_dashboard' %}" class="back-button">
        ← Back to Dashboard
    </a>
</header>

<main class="page-container">

    <div class="page-heading">
        <h1>Edit Profile</h1>
        <p>Update your personal and academic information.</p>
    </div>

    <div class="edit-card">

        <div class="profile-header">
            <div class="avatar">S</div>
            <div>
                <h2>Student Profile</h2>
                <p>Update your account details below.</p>
            </div>
        </div>

        <form id="editProfileForm">

            <h3 class="section-title">Personal Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name"
                           placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label>Registration Number</label>
                    <input type="text" name="registration_number"
                           placeholder="Enter registration number">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email"
                           placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone"
                           placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" name="department"
                           placeholder="Enter your department">
                </div>

                <div class="form-group">
                    <label>Degree Program</label>
                    <select name="degree">
                        <option value="">Select degree program</option>
                        <option>BS Software Engineering</option>
                        <option>BS Computer Science</option>
                        <option>BS Information Technology</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Current Semester</label>
                    <select name="semester">
                        <option value="">Select semester</option>
                        {% for number in "12345678" %}
                            <option>Semester {{ number }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>About Me</label>
                    <textarea name="about"
                              placeholder="Write a short introduction about yourself"></textarea>
                </div>

            </div>

            <div class="profile-actions">

                <button type="reset"
                        class="action-button cancel-button">
                    Cancel Changes
                </button>

                <button type="submit"
                        class="action-button save-button">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</main>

<script>
    document.getElementById("editProfileForm").addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Profile form submitted. Permanent saving is not enabled yet.");
    });
</script>

</body>
</html>
