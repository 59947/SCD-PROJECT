
{% extends "admins/base.html" %}

{% block content %}
<div class="admin-account-page">
    <h1>Change Password</h1>
    <p>Choose a new password for your administrator account.</p>

    <section class="account-form-card">
        <form method="post">
            {% csrf_token %}

            <label for="current_password">Current Password</label>
            <input id="current_password" type="password"
                   name="current_password" required autocomplete="current-password">

            <label for="new_password">New Password</label>
            <input id="new_password" type="password"
                   name="new_password" minlength="8" required
                   autocomplete="new-password">

            <label for="confirm_password">Confirm New Password</label>
            <input id="confirm_password" type="password"
                   name="confirm_password" minlength="8" required
                   autocomplete="new-password">

            <div class="form-actions">
                <button type="submit">Update Password</button>
                <a href="{% url 'admins:admin_profile' %}">Cancel</a>
            </div>
        </form>
    </section>
</div>

<style>
.admin-account-page { color:#263449; }
.admin-account-page h1 { font-size:25px; margin-bottom:6px; }
.admin-account-page p { color:#718096; }
.account-form-card { background:#fff; border:1px solid #e5eaf1; border-radius:12px; padding:28px; max-width:650px; margin-top:22px; }
.account-form-card label { display:block; font-weight:600; margin:16px 0 7px; }
.account-form-card input { width:100%; box-sizing:border-box; padding:12px; border:1px solid #d9e0e9; border-radius:7px; font:inherit; }
.form-actions { display:flex; align-items:center; gap:16px; margin-top:24px; }
.form-actions button { border:0; background:#102747; color:white; padding:12px 20px; border-radius:7px; cursor:pointer; font:inherit; }
.form-actions a { color:#526176; text-decoration:none; }
</style>
{% endblock %}
